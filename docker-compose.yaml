version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: c2c_postgres
    restart: always
    environment:
      POSTGRES_DB: c2c_risk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: c2c_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
